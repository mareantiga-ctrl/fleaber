# A002 — Catálogo vazio bloqueia avanço (snackbar ao Continuar).
appId: com.mycompany.fleaber
---
- runFlow: ../../subflows/login_seller.yaml
- runFlow: ../../subflows/nav_seller_to_prep.yaml
- extendedWaitUntil:
    visible:
      id: prep_tab_meu_catalogo
    timeout: 30000
- tapOn:
    id: prep_tab_meu_catalogo
- extendedWaitUntil:
    visible:
      id: prep_continuar
    timeout: 15000
- tapOn:
    id: prep_continuar
- extendedWaitUntil:
    visible:
      id: prep_snack_need_item
    timeout: 20000
- takeScreenshot: a002_empty_blocked
