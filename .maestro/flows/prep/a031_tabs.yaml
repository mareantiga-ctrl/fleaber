# A031 — Alternar tabs Meu Catálogo ↔ Sem catálogo.
appId: com.mycompany.fleaber
---
- runFlow: ../../subflows/login_seller.yaml
- runFlow: ../../subflows/nav_seller_to_prep.yaml
- tapOn:
    id: prep_tab_sem_catalogo
- extendedWaitUntil:
    visible:
      id: prep_sem_catalogo_hint
    timeout: 15000
- tapOn:
    id: "prep_ref_from"
- inputText: "88"
- tapOn:
    id: "prep_ref_to"
- inputText: "88"
- tapOn:
    id: prep_tab_meu_catalogo
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: prep_tab_meu_catalogo
    timeout: 15000
- tapOn:
    id: prep_tab_sem_catalogo
- extendedWaitUntil:
    visible: "88"
    timeout: 15000
- takeScreenshot: a031_tabs_state
