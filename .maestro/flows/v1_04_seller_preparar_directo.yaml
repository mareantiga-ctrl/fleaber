# V1.2a parcial — Vendedora: Criar → Novo Direto → preparar (sem emitir vídeo)
appId: com.mycompany.fleaber
---
- runFlow: ../subflows/login_seller.yaml
- tapOn: "Fleaber criar"
- extendedWaitUntil:
    visible: "Novo Direto"
    timeout: 15000
- tapOn: "Novo Direto"
- runFlow: ../subflows/dismiss_permissions.yaml
- extendedWaitUntil:
    visible: "Preparar"
    timeout: 45000
    optional: true
