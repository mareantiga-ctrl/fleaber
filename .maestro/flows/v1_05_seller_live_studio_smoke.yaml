# V1.2a + V1.2d parcial — Painel studio via Novo Direto (navegação UX).
appId: com.mycompany.fleaber
---
- runFlow: ../subflows/login_seller.yaml
- runFlow: ../subflows/nav_seller_to_criar_directo.yaml
- extendedWaitUntil:
    visible: "Operação"
    timeout: 90000
    optional: true
- runFlow:
    when:
      visible: "Operação"
    commands:
      - tapOn: "Operação"
      - extendedWaitUntil:
          visible: "Pagamentos"
          timeout: 20000
          optional: true
      - tapOn:
          text: "Pagamentos"
          optional: true
