# V2 — Comprador: player + saco + rifa (participar no sheet).
appId: com.mycompany.fleaber
---
- runFlow: ../subflows/login_buyer.yaml
- openLink: ${MAESTRO_DEEP_LINK_BASE}/fleaberLivePlayer?liveId=${MAESTRO_LIVE_ID}&isLive=true
- extendedWaitUntil:
    visible: "Saco da live"
    timeout: 90000
- tapOn:
    text: "Rifa da Live"
    optional: true
- extendedWaitUntil:
    visible: "Participar na Rifa"
    timeout: 45000
    optional: true
- tapOn:
    text: "Participar na Rifa (+1)"
    optional: true
- extendedWaitUntil:
    visible: "Ganha mais rifas"
    timeout: 30000
    optional: true
- tapOn: "Saco da live"
- extendedWaitUntil:
    visible: "Saco da live"
    timeout: 20000
