# V2 — Comprador: player + saco + rifa (participar no sheet).
appId: com.mycompany.fleaber
---
- runFlow: ../subflows/login_buyer.yaml
- runFlow: ../subflows/nav_buyer_to_live_player.yaml
- extendedWaitUntil:
    visible: "Saco da live"
    timeout: 90000
- takeScreenshot: cs10_buyer_player
- tapOn:
    text: "Rifa da Live"
    optional: true
- extendedWaitUntil:
    visible: "Participar na Rifa (+1)"
    timeout: 45000
- takeScreenshot: cs10_buyer_raffle_sheet
- tapOn:
    text: "Participar na Rifa (+1)"
    optional: true
- extendedWaitUntil:
    visible: "Ganha mais rifas"
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: "Ganha mais rifas"
    commands:
      - tapOn:
          text: "Fechar"
          optional: true
      - tapOn:
          text: "OK"
          optional: true
      - pressKey: back
- tapOn:
    text: "Saco.*"
- extendedWaitUntil:
    visible: "Saco da live"
    timeout: 20000
- takeScreenshot: cs10_buyer_bag
