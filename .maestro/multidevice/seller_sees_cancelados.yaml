# Seller: Pagamentos mostra cancelados pelo comprador.
appId: com.mycompany.fleaber
---
- openLink: ${MAESTRO_DEEP_LINK_BASE}/criarDirecto
- extendedWaitUntil:
    visible: "Operação"
    timeout: 120000
    optional: true
- tapOn:
    text: "Operação"
    optional: true
- tapOn: "Pagamentos"
- extendedWaitUntil:
    visible: "Cancelados pelo comprador"
    timeout: 60000
- assertVisible: "Cancelados pelo comprador"
