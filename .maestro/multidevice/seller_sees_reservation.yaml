# V1.5 — Seller: reabrir studio e ver Aceitar (apos buyer no outro device).
appId: com.mycompany.fleaber
---
- runFlow: ../subflows/nav_seller_to_criar_directo.yaml
- extendedWaitUntil:
    visible: "Operação"
    timeout: 120000
    optional: true
- tapOn:
    text: "Operação"
    optional: true
- tapOn:
    text: "A tratar"
    optional: true
- extendedWaitUntil:
    visible: "Aceitar"
    timeout: 90000
- assertVisible: "Aceitar"
