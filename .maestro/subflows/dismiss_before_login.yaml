# Fecha popups/dialogos do sistema antes do ecra de login Fleaber.
# Nota: nao usar pressKey back no arranque — no login fecha a app.
appId: com.mycompany.fleaber
---
- runFlow:
    when:
      visible: "isn't responding"
    commands:
      - tapOn: "Wait"
- runFlow:
    when:
      visible: "não está a responder"
    commands:
      - tapOn: "Aguardar"
- runFlow:
    when:
      visible: "not responding"
    commands:
      - tapOn: "Wait"
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- runFlow:
    when:
      visible: "Cancelar"
    commands:
      - tapOn: "Cancelar"
- runFlow:
    when:
      visible: "Fechar"
    commands:
      - tapOn: "Fechar"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
# Nao usar "Nao" — faz match em "Nao tem uma conta?" no login.
- runFlow:
    when:
      visible: "Agora não"
    commands:
      - tapOn: "Agora não"
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- runFlow: dismiss_permissions.yaml
- hideKeyboard
