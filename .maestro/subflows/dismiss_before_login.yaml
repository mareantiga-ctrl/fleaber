# Fecha popups/dialogos do sistema antes do ecra de login Fleaber.
appId: com.mycompany.fleaber
---
- pressKey: back
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- runFlow:
    when:
      visible: "Cancelar"
    commands:
      - tapOn: "Cancelar"
- runFlow:
    when:
      visible: "Fechar"
    commands:
      - tapOn: "Fechar"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      visible: "Não"
    commands:
      - tapOn: "Não"
- runFlow:
    when:
      visible: "Agora não"
    commands:
      - tapOn: "Agora não"
- runFlow:
    when:
      visible: "Not now"
    commands:
      - tapOn: "Not now"
- runFlow: dismiss_permissions.yaml
- hideKeyboard
