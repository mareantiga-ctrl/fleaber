appId: com.mycompany.fleaber
---
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- runFlow:
    when:
      visible: "Permitir"
    commands:
      - tapOn: "Permitir"
- runFlow:
    when:
      visible: "While using the app"
    commands:
      - tapOn: "While using the app"
- runFlow:
    when:
      visible: "Enquanto a app estiver a ser utilizada"
    commands:
      - tapOn: "Enquanto a app estiver a ser utilizada"
