# Arranque frio + retry se o emulador ficar no launcher (cold start lento).

appId: com.mycompany.fleaber

---

- launchApp:

    clearState: true

- runFlow:

    when:

      visible: "isn't responding"

    commands:

      - tapOn: "Wait"

- runFlow:

    when:

      visible: "not responding"

    commands:

      - tapOn: "Wait"

- runFlow:

    when:

      visible: "Process system isn't responding"

    commands:

      - tapOn: "Wait"

- runFlow:

    when:

      visible: "Close app"

    commands:

      - tapOn: "Wait"

- runFlow: dismiss_permissions.yaml

- extendedWaitUntil:

    visible: "E-mail"

    timeout: 120000

- extendedWaitUntil:

    visible: "Bem-vindo de volta!"

    timeout: 15000

    optional: true

