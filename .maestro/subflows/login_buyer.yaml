appId: com.mycompany.fleaber
---
- runFlow: launch_fleaber_login.yaml
- extendedWaitUntil:
    visible: "Bem-vindo de volta!"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    text: "E-mail"
    index: 0
- eraseText: 80
- inputText: ${MAESTRO_BUYER_EMAIL}
- extendedWaitUntil:
    visible: "${MAESTRO_BUYER_EMAIL}"
    timeout: 15000
- hideKeyboard
- extendedWaitUntil:
    visible: "Senha"
    timeout: 30000
- tapOn:
    text: "Senha"
    index: 0
    waitUntilVisible: true
- eraseText: 40
- inputText: ${MAESTRO_BUYER_PASSWORD}
- hideKeyboard
- extendedWaitUntil:
    visible: "Entrar"
    timeout: 45000
- tapOn:
    text: "Entrar"
    retryTapIfNoChange: true
- tapOn:
    text: "Ok"
    optional: true
- extendedWaitUntil:
    notVisible: "Entrar"
    timeout: 20000
    optional: true
- runFlow: dismiss_permissions.yaml
- extendedWaitUntil:
    visible: "Início"
    timeout: 90000
