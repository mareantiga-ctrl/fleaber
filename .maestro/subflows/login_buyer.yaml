appId: com.mycompany.fleaber
---
- runFlow: launch_fleaber_login.yaml
- tapOn:
    id: login_email
- inputText: ${MAESTRO_BUYER_EMAIL}
- tapOn:
    id: login_password
- inputText: ${MAESTRO_BUYER_PASSWORD}
- pressKey: back
- scrollUntilVisible:
    element:
      id: login_entrar
    direction: DOWN
    timeout: 15000
- tapOn:
    id: login_entrar
- runFlow: dismiss_permissions.yaml
- extendedWaitUntil:
    visible: "Início"
    timeout: 180000
