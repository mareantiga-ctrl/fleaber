appId: com.mycompany.fleaber
---
- runFlow: launch_fleaber_login.yaml
- tapOn:
    text: "E-mail"
    index: 0
- eraseText
- inputText: ${MAESTRO_SELLER_EMAIL}
- extendedWaitUntil:
    visible: "Senha"
    timeout: 15000
- tapOn:
    text: "Senha"
    index: 0
- eraseText
- inputText: ${MAESTRO_SELLER_PASSWORD}
- hideKeyboard
- extendedWaitUntil:
    visible: "Entrar"
    timeout: 45000
- tapOn:
    text: "Entrar"
    retryTapIfNoChange: true
- extendedWaitUntil:
    notVisible: "Entrar"
    timeout: 20000
    optional: true
- runFlow: dismiss_permissions.yaml
- extendedWaitUntil:
    visible: "Início"
    timeout: 90000
