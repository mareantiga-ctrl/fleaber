# Credenciais seller (sem launch).
appId: com.mycompany.fleaber
---
- tapOn:
    id: login_email
- inputText: ${MAESTRO_SELLER_EMAIL}
- tapOn:
    id: login_password
- inputText: ${MAESTRO_SELLER_PASSWORD}
- pressKey: back
- scrollUntilVisible:
    element:
      id: login_entrar
    direction: DOWN
    timeout: 15000
- tapOn:
    id: login_entrar
- runFlow: dismiss_permissions.yaml
