# Navegação UX: Home → card da live MAESTRO → player.
# Substitui openLink fleaberLivePlayer nos testes de comprador.
appId: com.mycompany.fleaber
---
- extendedWaitUntil:
    visible: "Início"
    timeout: 30000
- swipe:
    start: "50%,25%"
    end: "50%,75%"
    optional: true
- extendedWaitUntil:
    visible: "A decorrer agora"
    timeout: 30000
    optional: true
- scrollUntilVisible:
    element:
      text: "MAESTRO"
    direction: DOWN
    timeout: 60000
    optional: true
- scrollUntilVisible:
    element:
      text: ".*MAESTRO.*"
    direction: DOWN
    timeout: 60000
    optional: true
- tapOn:
    text: ".*MAESTRO.*"
    optional: true
- tapOn:
    text: "AO VIVO"
    optional: true
- extendedWaitUntil:
    visible: "Saco da live"
    timeout: 90000
