# Navegação UX: Home → Fleaber criar → Novo Direto → prep → câmara.
# Substitui openLink criarDirecto nos testes vendedor.
appId: com.mycompany.fleaber
---
- extendedWaitUntil:
    visible: "Início"
    timeout: 30000
- tapOn: "Fleaber criar"
- extendedWaitUntil:
    visible: "Novo Direto"
    timeout: 15000
- tapOn: "Novo Direto"
- runFlow: dismiss_permissions.yaml
- extendedWaitUntil:
    visible: "Artigos do directo"
    timeout: 120000
    optional: true
- extendedWaitUntil:
    visible: "Continuar para o directo"
    timeout: 60000
    optional: true
- tapOn:
    text: "Continuar para o directo"
    optional: true
- extendedWaitUntil:
    visible: "Iniciar Direto"
    timeout: 120000
    optional: true
