# Home → FAB Criar → Novo Directo → prep (toques Maestro, sem deep link).
appId: com.mycompany.fleaber
---
- extendedWaitUntil:
    visible: "Início"
    timeout: 60000
- tapOn:
    id: home_fleaber_criar
- waitForAnimationToEnd:
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: prep_sheet_novo_direto
    timeout: 30000
- takeScreenshot: prep_create_sheet
- tapOn:
    id: prep_sheet_novo_direto
- runFlow: dismiss_permissions.yaml
- extendedWaitUntil:
    visible: "Artigos do directo"
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: prep_continuar
    timeout: 60000
