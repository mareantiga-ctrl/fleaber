# Tab Sem catálogo → intervalo 99 → gravar.
appId: com.mycompany.fleaber
---
- tapOn:
    id: prep_tab_sem_catalogo
- waitForAnimationToEnd:
    timeout: 5000
- runFlow: prep_strip_refs.yaml
- extendedWaitUntil:
    visible:
      id: prep_sem_catalogo_hint
    timeout: 20000
- tapOn:
    id: prep_ref_from
- eraseText: 10
- inputText: "99"
- tapOn:
    id: prep_ref_to
- eraseText: 10
- inputText: "99"
- tapOn:
    id: prep_ref_save
- extendedWaitUntil:
    visible:
      id: prep_ref_row_0
    timeout: 20000
