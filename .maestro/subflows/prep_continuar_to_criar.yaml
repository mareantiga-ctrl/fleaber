# Continuar prep → criar directo (linhagem opcional + ecrã emitir).
appId: com.mycompany.fleaber
---
- tapOn:
    id: prep_continuar
- extendedWaitUntil:
    visible:
      id: prep_lineage_sheet
    timeout: 45000
    optional: true
- runFlow:
    when:
      visible:
        id: prep_lineage_sheet
    commands:
      - tapOn:
          id: prep_lineage_new_history
      - waitForAnimationToEnd:
          timeout: 8000
- runFlow: dismiss_permissions.yaml
- extendedWaitUntil:
    visible:
      id: criar_directo_title
    timeout: 120000
- extendedWaitUntil:
    visible: "Iniciar Direto"
    timeout: 30000
    optional: true
