  <!-- App shell default: noindex (rotas autenticadas). Hub bootstrap + Dart HubSeoService sobrescrevem em rotas publicadas fleaber.pt -->
  <meta name="robots" content="noindex,nofollow" />

  <!-- Favicon -->
  <link rel="icon" href="Gemini_Generated_Image_tkp4qitkp4qitkp4(2).png" sizes="any"/>

  <!-- Open Graph & SEO defaults (Hub bootstrap + lib/hub/seo actualizam por rota) -->
  <meta property="og:title" content="Fleaber" />

  <title>Fleaber</title>
  <meta name="description" content="Live shopping e marketplace em Portugal." />
  <link rel="canonical" href="https://fleaber.pt" />

  <!-- Hub SEO early bootstrap (crawlers FB/Google/WhatsApp — ver docs/live-hub-master-plan.md §2.28) -->
  <script src="hub_seo_bootstrap.js" defer></script>

  <!-- Status Bar color in Safari browser (iOS) and PWA -->

  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#1d2428">

  <link rel="manifest" href="manifest.json">
  <!-- E85.3: prova de versão no HTML servido (actualizado no deploy). -->
  <meta name="fleaber-build" content="161.1-hub-utf8-encoding-20261105">
</head>
<body>
  <script>
    // E85.3 — limpar SW/Cache Storage ANTES do bootstrap Flutter.
    // O unregister assíncrono (E85.2) deixava o loader a servir main.dart.js antigo.
    (async function () {
      try {
        // Sessões Stripe antigas: /fleahub/index.html#/stripe-success → /fleahub/#/…
        var path = location.pathname || '';
        var hash = location.hash || '';
        if (/\/fleahub\/index\.html$/i.test(path) && hash.indexOf('stripe-success') >= 0) {
          var q = location.search || '';
          location.replace(location.origin + '/fleahub/' + q + hash);
          return;
        }
      } catch (e0) {}
      try {
        if ('serviceWorker' in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
        }
        if (window.caches && caches.keys) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }
      } catch (e) {
        console.warn('fleaber cache clear', e);
      }
      var s = document.createElement('script');
      // Cache-bust bootstrap (evita builds:[{},{}] + CDN canvaskit antigo).
      s.src = 'flutter_bootstrap.js?v=161.1';
      s.async = false;
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
